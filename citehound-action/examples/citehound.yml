# Copy this file to .github/workflows/citehound.yml in your own repository, then run it from the Actions tab.
name: AI readiness
on: workflow_dispatch
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: andacuzel/citehound-action@v1
        with:
          domain: example.com
          min-score: 70
          fail-on-crawler-block: true
