# Copy this file to .github/workflows/citehound.yml in your own repository.
name: AI readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'     # Mondays, 09:00 UTC
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: andacuzel/citehound-action@v1
        with:
          domain: example.com
          min-score: 70
          fail-on-crawler-block: true
