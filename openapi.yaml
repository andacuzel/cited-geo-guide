        checkFailureRates:
          type:
            - "object"
            - "null"
        note:
          type: "string"
        method:
          type: "string"
  responses:
    BadRequest:
      description: "The request is not valid: a missing or malformed parameter."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "invalid_request"
            message: "The request is not valid: a missing or malformed parameter."
    Unauthorized:
      description: "The key is missing or not valid. A WWW-Authenticate header says how to send it."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "invalid_key"
            message: "The key is missing or not valid. A WWW-Authenticate header says how to send it."
      headers:
        "WWW-Authenticate":
          description: "How to send the key."
          schema:
            type: "string"
    PlanRequired:
      description: "The endpoint, or the full output, is part of a higher plan than the key's. The body names the plan that has it (required_plan) and links the plans."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "plan_required"
            message: "The endpoint, or the full output, is part of a higher plan than the key's. The body names the plan that has it (required_plan) and links the plans."
    Forbidden:
      description: "The key has been revoked."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "key_revoked"
            message: "The key has been revoked."
    NotFound:
      description: "No such category or endpoint."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "not_found"
            message: "No such category or endpoint."
    Conflict:
      description: "A limit of the Pro plan was reached (watchlist_full, webhook_limit) or the item already exists (webhook_exists)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "watchlist_full"
            message: "A limit of the Pro plan was reached (watchlist_full, webhook_limit) or the item already exists (webhook_exists)."
    TooLarge:
      description: "The request body is larger than the limit."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "too_large"
            message: "The request body is larger than the limit."
    UnsupportedMediaType:
      description: "Send JSON with Content-Type: application/json."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "unsupported_media_type"
            message: "Send JSON with Content-Type: application/json."
    RateLimited:
      description: "A limit was reached (the key's requests, a free key's scans a day, one domain, or one network address). The Retry-After header gives the seconds to wait; the body names the limit."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error: "rate_limited"
            message: "A limit was reached (the key's requests, a free key's scans a day, one domain, or one network address). The Retry-After header gives the seconds to wait; the body names the limit."
      headers:
        "Retry-After":
          description: "Seconds to wait before trying again."
          schema:
            type: "integer"
